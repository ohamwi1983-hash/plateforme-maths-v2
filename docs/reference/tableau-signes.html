<script>
function cycleCell(el, values) {
  var current = el.textContent.trim();
  var idx = values.indexOf(current);
  var next = (idx === -1) ? values[0] : values[(idx + 1) % values.length];
  el.textContent = next;
}

function drawArrow(button, up) {
  var rect = button.getBoundingClientRect();
  var w = rect.width * 0.68;
  var h = rect.height * 0.42;
  var angleDeg = Math.atan2(h, w) * 180 / Math.PI;
  var length = Math.sqrt(w * w + h * h);
  var rotation = up ? -angleDeg : angleDeg;
  button.innerHTML =
    '<div style="position:absolute;left:50%;top:50%;width:' + length + 'px;height:0;transform:translate(-50%,-50%) rotate(' + rotation + 'deg);">' +
      '<div style="width:100%;height:2px;background:#1C1730;border-radius:1px;"></div>' +
      '<svg width="11" height="11" viewBox="0 0 10 10" style="position:absolute;right:-3px;top:-5.5px;overflow:visible;">' +
        '<path d="M0,0 L9,5 L0,10" fill="none" stroke="#1C1730" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>' +
    '</div>';
}

function cycleArrow(el) {
  var state = el.getAttribute('data-state') || '?';
  var next = (state === 'up') ? 'down' : 'up';
  el.setAttribute('data-state', next);
  drawArrow(el, next === 'up');
}
</script>
