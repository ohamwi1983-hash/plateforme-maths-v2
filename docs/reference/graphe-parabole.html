<!doctype html>

<title>Référence — graphique d'une parabole et annotations d'une aide</title>
<!-- RÉFÉRENCE du GRAPHIQUE D'ÉCRAN (RAPPORT §56) : une parabole dans un repère gradué (quadrillage fin à chaque entier, graduations étiquetées), puis les annotations d'une aide par
     paliers posées SUR ce graphique : palier 1 = le sommet S ; palier 2 = le point A et deux vecteurs (écarts horizontal et vertical). Exemple : y = 2(x − 1)² − 3, A = (2 ; −1).
     Les valeurs sont celles des tokens du design system (docs/design-system.md) ; `chromium-design` compare les styles CALCULÉS de public/moteur/figures/grapheParabole.js à ce fichier.
     Géométrie (marges, repère → pixels) : voir grapheParabole.js. Blocs : « base » (aucune annotation), « palier 1 », « palier 2 ». -->
<style>
  body { margin: 0; padding: 16px; background: #FAF9FC; font-family: 'Inter', sans-serif; font-size: 16px; color: #1C1730; }
  .bloc { max-width: 560px; margin: 0 0 24px; }
  h2 { font-size: 0.9rem; margin: 0 0 8px; color: #6E6785; }
  svg { display: block; width: 100%; height: auto; font-family: 'Inter', sans-serif; }
  .cadre { fill: #FFFFFF; stroke: #E9E4F3; stroke-width: 1px; }
  .grille-fine { stroke: #F6F3FB; stroke-width: 1px; }
  .grille { stroke: #E9E4F3; stroke-width: 1px; }
  .axe { stroke: #6E6785; stroke-width: 2px; }
  .graduation { fill: #6E6785; font-size: 0.7em; }
  .courbe { fill: none; stroke: #7C3AED; stroke-width: 3px; stroke-linecap: round; }
  .point-annote { fill: #F5A623; stroke: #1C1730; stroke-width: 2px; }
  .vecteur { stroke: #E08A2E; stroke-width: 2px; }
  .pointe { fill: #E08A2E; }
  .etiquette { fill: #1C1730; font-size: 0.8em; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  .forte { font-weight: 600; }
</style>
